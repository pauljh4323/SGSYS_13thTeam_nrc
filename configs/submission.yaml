# Submission config (Challenge 2, deep learning; branch r2-prep) = configs/dl/gru_v8p2zw80.yaml (method/params verbatim):
# gru_v8p2zw80 = WiSE-FT weight interpolation (Wortsman et al. 2022), no further training:
#   theta = 0.2 * gru_v8p2z3e + 0.8 * gru_v8p2z6a  (alpha = 0.8, every float tensor of model_state, scripts/wise_ft.py)
# - gru_v8p2z3e (weights/gru_v8p2z3e.pt): the previous submission, challenge train split only (speed/EQ clean augmentation,
#   dynamic mixing, train-time rms_norm; exp/r2-dmix).
# - gru_v8p2z6a (weights/gru_v8p2z6a.pt): z3e fine-tuned 300 epochs on external data (LibriSpeech train-clean-100 subset
#   clean p 0.5; DEMAND/ESC-50/MUSAN train_pool noise p 0.6; docs/external_data.md), selection on validation +
#   gen_unseen_dev + gen_multi_dev (exp/r2-ext).
# alpha chosen on validation + gen_*_dev only (rule: max dev mean with validation delta >= -0.02; docs/exp_r2_ext.md on
# exp/r2-ext). vs gru_v8p2z3e: validation 3.6393 (-0.014), val_remix 3.4907 (-0.005), pooled gen test (820) +0.233 (z 16.9).
# Level mode rms_norm: the input is scaled to target_rms = 0.079130 (median whole-file RMS of the train noisy files,
# scripts/rms_target.py) before the model; the output stays at that level (no inverse gain; peak capped at 0.99).
# Fallbacks (copy their method/params here to revert): gru_v8p2z3e + rms_norm (configs/dl/gru_v8p2z3e.yaml; val 3.6534 /
# 1.21 dB) and gru_v5b (configs/dl/gru_v5b_off.yaml; val 2.6962 / 16.81 dB). Round-1 submission (dsp-v7) stays on main.
method: gru_mask
params:
  weights: weights/gru_v8p2zw80.pt  # resolved against the repo root, not the cwd
  device: cpu
  level_norm: true
  level_mode: rms_norm
  target_rms: 0.079130
